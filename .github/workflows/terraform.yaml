name: Terraform Management

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: terraform-management-security
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_control_tower_operator_arn: ${{ vars.CONTROL_TOWER_OPERATOR_ARN }}

jobs:
  terraform:
    name: Plan e Apply da management
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: management-security

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ vars.TERRAFORM_VERSION }}

      - name: Configurar credenciais AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: github-${{ github.run_id }}
          managed-session-policies: ${{ github.event_name == 'pull_request' && 'arn:aws:iam::aws:policy/ReadOnlyAccess' || '' }}

      - name: Confirmar conta AWS
        run: aws sts get-caller-identity

      - name: Gerar token de leitura dos módulos com GitHub App
        id: modules-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: igor-platform-lab
          repositories: terraform-modules
          permission-contents: read

      - name: Terraform Init
        env:
          MODULES_READ_TOKEN: ${{ steps.modules-token.outputs.token }}
          BACKEND_CONFIG: ${{ vars.BACKEND_CONFIG }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          if [[ -z "$MODULES_READ_TOKEN" ]]; then
            echo "::error::O GitHub App não gerou o token de leitura de terraform-modules."
            exit 1
          fi

          modules_auth=$(printf 'x-access-token:%s' "$MODULES_READ_TOKEN" | base64 -w0)
          echo "::add-mask::$modules_auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/igor-platform-lab/terraform-modules.git.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $modules_auth"

          terraform init -input=false -backend-config="$BACKEND_CONFIG"

      - name: Terraform Fmt Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        env:
          PLAN_LOCK: ${{ github.event_name == 'push' && 'true' || 'false' }}
        run: terraform plan -input=false -no-color -lock="$PLAN_LOCK" -lock-timeout=5m -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan
